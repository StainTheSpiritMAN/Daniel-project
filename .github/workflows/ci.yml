name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build API & Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build API
        run: npm run build:api

      - name: Build Web
        run: npm run build:web
        env:
          # Public build-time config (safe, non-secret defaults for CI)
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          NEXT_PUBLIC_SITE_NAME: Suburban Integrated Services Limited
          NEXT_PUBLIC_SITE_URL: https://www.suburbanintegratedservices.com
